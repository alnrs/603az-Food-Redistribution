<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse food | ShareBite</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><aside class="side"><a class="brand" style="color:white;margin-bottom:20px" href="dashboard.html">🌿 ShareBite</a><a href="dashboard.html">Dashboard</a><a href="browse.html">Browse food</a><a href="add-food.html">Add food</a><a href="my-listings.html">My listings</a><a href="messages.html">Messages</a><a href="profile.html">Profile</a><a href="privacy.html">Privacy</a><a href="#" onclick="signOut();return false">Sign out</a></aside><main class="main"><header class="top"><div><strong data-name>User</strong><div class="meta" data-email></div></div><button class="btn outline" onclick="signOut()">Sign out</button></header><div class="content"><h1>Browse available food</h1><p class="meta">Only authenticated users can access this page.</p><div class="form-group"><input id="search" placeholder="Search food or area"></div><div id="msg" class="message"></div><section id="grid" class="listing-grid"></section></div></main></div><script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script src="js/api.js"></script><script>let items=[];function render(a){grid.innerHTML=a.length?a.map(x=>`<article class="card listing-card"><div class="listing-image">${x.imageUrl?`<img src="${esc(x.imageUrl)}" alt="${esc(x.foodName)}">`:'Food photograph'}</div><div class="listing-body"><h3>${esc(x.foodName||'Unnamed food')}</h3><p class="meta"><b>Quantity:</b> ${esc(x.quantity||'N/A')}<br><b>Area:</b> ${esc(x.location||'N/A')}<br><b>Deadline:</b> ${esc(fmt(x.expiryTime))}</p><a class="btn outline" href="messages.html">Message donor</a></div></article>`).join(''):'<p>No listings found.</p>'}document.addEventListener('DOMContentLoaded',async()=>{if(!await requireAuth())return;try{const r=await apiRequest();items=Array.isArray(r)?r:r.items||[];render(items);showMessage(msg,items.length+' listing(s) loaded','success')}catch(x){showMessage(msg,x.message,'error')}});search.oninput=()=>{const q=search.value.toLowerCase();render(items.filter(x=>`${x.foodName||''} ${x.location||''}`.toLowerCase().includes(q)))}</script></body></html>
