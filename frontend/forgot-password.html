<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Forgot Password | ShareBite</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth">

        <section class="auth-art">
            <a
                class="brand"
                style="color: white;"
                href="index.html"
            >
                🌿 ShareBite
            </a>

            <div>
                <h1>Forgot your password?</h1>

                <p>
                    Enter your registered email address and we will send you
                    a password-reset code.
                </p>
            </div>

            <small>
                The reset code will be sent by Amazon Cognito.
            </small>
        </section>

        <main class="auth-panel">

            <section class="auth-card">

                <h1>Reset password</h1>

                <div
                    id="authMessage"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <form id="forgotPasswordForm">

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <button
                        id="sendCodeButton"
                        class="btn primary"
                        type="submit"
                        style="width: 100%;"
                    >
                        Send reset code
                    </button>

                </form>

                <p style="margin-top: 20px; text-align: center;">
                    Remember your password?
                    <a href="login.html">
                        Return to sign in
                    </a>
                </p>

            </section>

        </main>

    </div>

    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>

    <script>
        "use strict";

        const messageBox = document.getElementById("authMessage");
        const form = document.getElementById("forgotPasswordForm");
        const button = document.getElementById("sendCodeButton");

        function showMessage(message, type = "error") {
            messageBox.textContent = message;
            messageBox.style.display = "block";

            messageBox.classList.remove(
                "error",
                "success",
                "alert-error",
                "alert-success"
            );

            if (type === "success") {
                messageBox.classList.add("success", "alert-success");
            } else {
                messageBox.classList.add("error", "alert-error");
            }
        }

        function setLoading(loading) {
            button.disabled = loading;
            button.textContent = loading
                ? "Sending code..."
                : "Send reset code";
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

            if (!email) {
                showMessage("Please enter your registered email address.");
                return;
            }

            if (!window.SHAREBITE_CONFIG) {
                showMessage("ShareBite configuration could not be loaded.");
                return;
            }

            const userPool =
                new AmazonCognitoIdentity.CognitoUserPool({
                    UserPoolId: window.SHAREBITE_CONFIG.userPoolId,
                    ClientId: window.SHAREBITE_CONFIG.userPoolClientId
                });

            const cognitoUser =
                new AmazonCognitoIdentity.CognitoUser({
                    Username: email,
                    Pool: userPool
                });

            setLoading(true);

            cognitoUser.forgotPassword({
                onSuccess: function () {
                    setLoading(false);
                },

                onFailure: function (error) {
                    setLoading(false);

                    showMessage(
                        error.message ||
                        "The password-reset code could not be sent."
                    );
                },

                inputVerificationCode: function () {
                    setLoading(false);

                    sessionStorage.setItem(
                        "sharebiteResetEmail",
                        email
                    );

                    showMessage(
                        "A password-reset code has been sent to your email.",
                        "success"
                    );

                    window.setTimeout(function () {
                        window.location.href =
                            "reset-password.html?email=" +
                            encodeURIComponent(email);
                    }, 1000);
                }
            });
        });
    </script>
</body>
</html>
