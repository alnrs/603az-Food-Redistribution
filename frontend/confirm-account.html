<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Confirm Account | ShareBite</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>
    <div class="auth">

        <section class="auth-art">
            <a
                class="brand"
                style="color: white;"
                href="index.html"
            >
                🌿 ShareBite
            </a>

            <div>
                <h1>Verify email</h1>

                <p>
                    Enter the confirmation code sent to your email.
                </p>
            </div>

            <small>
                Check your inbox and spam folder for the verification code.
            </small>
        </section>

        <main class="auth-panel">

            <section class="auth-card">

                <h1>Confirm account</h1>

                <div
                    id="authMessage"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <form id="confirmForm">

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmationCode">
                            Confirmation code
                        </label>

                        <input
                            id="confirmationCode"
                            name="confirmationCode"
                            type="text"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            required
                        >
                    </div>

                    <button
                        id="confirmButton"
                        class="btn primary"
                        type="submit"
                        style="width: 100%;"
                    >
                        Verify account
                    </button>

                </form>

                <button
                    id="resendCodeButton"
                    class="btn secondary"
                    type="button"
                    style="width: 100%; margin-top: 10px;"
                >
                    Resend code
                </button>

                <p style="margin-top: 20px; text-align: center;">
                    Already confirmed?
                    <a href="login.html">
                        Sign in
                    </a>
                </p>

            </section>

        </main>

    </div>

    <script
        src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"
    ></script>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
