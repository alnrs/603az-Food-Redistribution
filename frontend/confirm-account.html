<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm | ShareBite</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth"><section class="auth-art"><a class="brand" style="color:white" href="index.html">🌿 ShareBite</a><div><h1>Verify email</h1><p>Enter the code sent to your email.</p></div></section><main class="auth-panel"><section class="auth-card"><h1>Confirm account</h1><div id="msg" class="message"></div><form id="f"><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Code</label><input id="code" required></div><button class="btn primary">Verify</button></form><button id="res" class="btn secondary" style="margin-top:10px">Resend code</button></section></main></div><script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script>email.value=sessionStorage.getItem('pendingEmail')||'';f.onsubmit=async e=>{e.preventDefault();try{await confirm(email.value.trim(),code.value.trim());showMessage(msg,'Verified. Redirecting...','success');setTimeout(()=>location='login.html',1000)}catch(x){showMessage(msg,x.message,'error')}};res.onclick=async()=>{try{await resend(email.value.trim());showMessage(msg,'Code resent','success')}catch(x){showMessage(msg,x.message,'error')}}</script></body></html>
