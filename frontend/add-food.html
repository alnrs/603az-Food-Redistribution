<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Add food | ShareBite</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">

        <aside class="side">
            <a
                class="brand"
                style="color: white; margin-bottom: 20px;"
                href="dashboard.html"
            >
                🌿 ShareBite
            </a>

            <a href="dashboard.html">Dashboard</a>
            <a href="browse.html">Browse food</a>
            <a href="add-food.html">Add food</a>
            <a href="my-listings.html">My listings</a>
            <a href="messages.html">Messages</a>
            <a href="profile.html">Profile</a>
            <a href="privacy.html">Privacy</a>

            <a
                href="#"
                onclick="logoutUser(event); return false;"
            >
                Sign out
            </a>
        </aside>

        <main class="main">

            <header class="top">
                <div>
                    <strong data-name>
                        User
                    </strong>

                    <div
                        class="meta"
                        data-email
                    ></div>
                </div>

                <button
                    class="btn outline"
                    type="button"
                    onclick="logoutUser(event);"
                >
                    Sign out
                </button>
            </header>

            <div class="content">

                <h1>Add a food listing</h1>

                <p class="meta">
                    No public phone number is collected.
                </p>

                <div class="grid g2">

                    <section class="card">

                        <form id="foodListingForm">

                            <div class="form-group">
                                <label for="foodName">
                                    Food name
                                </label>

                                <input
                                    id="foodName"
                                    name="foodName"
                                    type="text"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="category">
                                    Category
                                </label>

                                <select
                                    id="category"
                                    name="category"
                                    required
                                >
                                    <option value="Fruit and vegetables">
                                        Fruit and vegetables
                                    </option>

                                    <option value="Bakery">
                                        Bakery
                                    </option>

                                    <option value="Prepared meals">
                                        Prepared meals
                                    </option>

                                    <option value="Dairy">
                                        Dairy
                                    </option>

                                    <option value="Pantry">
                                        Pantry
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="description">
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    name="description"
                                    required
                                ></textarea>
                            </div>

                            <div class="form-group">
                                <label for="quantity">
                                    Quantity
                                </label>

                                <input
                                    id="quantity"
                                    name="quantity"
                                    type="text"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="collectionArea">
                                    Collection area
                                </label>

                                <input
                                    id="collectionArea"
                                    name="collectionArea"
                                    type="text"
                                    placeholder="Example: Coventry CV1"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="expiryTime">
                                    Collection deadline
                                </label>

                                <input
                                    id="expiryTime"
                                    name="expiryTime"
                                    type="datetime-local"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="allergyInfo">
                                    Allergy information
                                </label>

                                <textarea
                                    id="allergyInfo"
                                    name="allergyInfo"
                                    required
                                ></textarea>
                            </div>

                            <div class="form-group">
                                <label for="storageInstructions">
                                    Storage instructions
                                </label>

                                <textarea
                                    id="storageInstructions"
                                    name="storageInstructions"
                                ></textarea>
                            </div>

                            <button
                                id="publishButton"
                                class="btn primary"
                                type="submit"
                            >
                                Publish listing
                            </button>

                            <div
                                id="listingMessage"
                                class="message"
                                role="alert"
                                aria-live="polite"
                            ></div>

                        </form>

                    </section>

                    <aside class="card">

                        <h3>Food photograph</h3>

                        <label
                            class="upload"
                            for="photo"
                        >
                            Choose JPG, PNG or WebP (max 5 MB)
                        </label>

                        <input
                            id="photo"
                            name="photo"
                            type="file"
                            accept="image/jpeg,image/png,image/webp"
                            hidden
                        >

                        <div
                            id="preview"
                            class="preview"
                        >
                            <img
                                id="previewImg"
                                alt="Selected food preview"
                            >
                        </div>

                        <p class="meta">
                            Preview works now. Permanent upload requires
                            the S3 presigned-URL backend endpoint.
                        </p>

                    </aside>

                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>

    <!--
        api.js expects a global idToken variable.
        This creates it before api.js is loaded.
    -->
    <script>
        var idToken = "";
    </script>

    <script src="js/api.js"></script>

    <script>
        "use strict";

        let userClaims = null;

        const listingForm =
            document.getElementById(
                "foodListingForm"
            );

        const publishButton =
            document.getElementById(
                "publishButton"
            );

        const listingMessage =
            document.getElementById(
                "listingMessage"
            );

        const photoInput =
            document.getElementById("photo");

        const previewContainer =
            document.getElementById("preview");

        const previewImage =
            document.getElementById(
                "previewImg"
            );

        function decodeJwtPayload(token) {
            if (
                !token ||
                typeof token !== "string"
            ) {
                throw new Error(
                    "A valid authentication token was not received."
                );
            }

            const tokenParts = token.split(".");

            if (tokenParts.length !== 3) {
                throw new Error(
                    "The authentication token is invalid."
                );
            }

            let encodedPayload =
                tokenParts[1]
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

            while (
                encodedPayload.length % 4 !== 0
            ) {
                encodedPayload += "=";
            }

            const decodedPayload =
                window.atob(encodedPayload);

            const jsonPayload =
                decodeURIComponent(
                    decodedPayload
                        .split("")
                        .map(function (
                            character
                        ) {
                            return (
                                "%" +
                                (
                                    "00" +
                                    character
                                        .charCodeAt(0)
                                        .toString(16)
                                ).slice(-2)
                            );
                        })
                        .join("")
                );

            return JSON.parse(jsonPayload);
        }

        async function initialisePage() {
            try {
                if (
                    !window.ShareBiteAuth ||
                    typeof window.ShareBiteAuth
                        .getIdToken !== "function"
                ) {
                    throw new Error(
                        "Authentication services could not be loaded."
                    );
                }

                /*
                 * Get a valid Cognito token.
                 * The global variable is used by api.js.
                 */
                idToken =
                    await window.ShareBiteAuth
                        .getIdToken();

                /*
                 * Also store it for other pages and scripts.
                 */
                localStorage.setItem(
                    "sharebiteIdToken",
                    idToken
                );

                userClaims =
                    decodeJwtPayload(idToken);

                const nameElement =
                    document.querySelector(
                        "[data-name]"
                    );

                const emailElement =
                    document.querySelector(
                        "[data-email]"
                    );

                if (nameElement) {
                    nameElement.textContent =
                        userClaims.name ||
                        userClaims.email ||
                        "ShareBite user";
                }

                if (emailElement) {
                    emailElement.textContent =
                        userClaims.email || "";
                }

                const expiryInput =
                    document.getElementById(
                        "expiryTime"
                    );

                const currentTime =
                    new Date();

                currentTime.setMinutes(
                    currentTime.getMinutes() -
                    currentTime.getTimezoneOffset()
                );

                expiryInput.min =
                    currentTime
                        .toISOString()
                        .slice(0, 16);

            } catch (error) {
                console.error(
                    "Page authentication failed:",
                    error
                );

                showMessage(
                    listingMessage,
                    "Your login session has expired. Redirecting to sign in.",
                    "error"
                );

                window.setTimeout(
                    function () {
                        window.location.href =
                            "login.html";
                    },
                    1500
                );
            }
        }

        photoInput.addEventListener(
            "change",
            function () {
                const selectedFile =
                    photoInput.files[0];

                if (!selectedFile) {
                    return;
                }

                const acceptedTypes = [
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ];

                const maximumFileSize =
                    5 * 1024 * 1024;

                if (
                    !acceptedTypes.includes(
                        selectedFile.type
                    ) ||
                    selectedFile.size >
                        maximumFileSize
                ) {
                    showMessage(
                        listingMessage,
                        "Use JPG, PNG or WebP up to 5 MB.",
                        "error"
                    );

                    photoInput.value = "";
                    previewImage.removeAttribute(
                        "src"
                    );

                    previewContainer.classList
                        .remove("show");

                    return;
                }

                previewImage.src =
                    URL.createObjectURL(
                        selectedFile
                    );

                previewContainer.classList.add(
                    "show"
                );
            }
        );

        listingForm.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                publishButton.disabled = true;
                publishButton.textContent =
                    "Publishing...";

                hideMessage(listingMessage);

                try {
                    /*
                     * Refresh the token before every
                     * protected POST request.
                     */
                    idToken =
                        await window.ShareBiteAuth
                            .getIdToken();

                    localStorage.setItem(
                        "sharebiteIdToken",
                        idToken
                    );

                    userClaims =
                        decodeJwtPayload(idToken);

                    const foodNameValue =
                        document
                            .getElementById(
                                "foodName"
                            )
                            .value
                            .trim();

                    const categoryValue =
                        document
                            .getElementById(
                                "category"
                            )
                            .value;

                    const descriptionValue =
                        document
                            .getElementById(
                                "description"
                            )
                            .value
                            .trim();

                    const quantityValue =
                        document
                            .getElementById(
                                "quantity"
                            )
                            .value
                            .trim();

                    const collectionAreaValue =
                        document
                            .getElementById(
                                "collectionArea"
                            )
                            .value
                            .trim();

                    const expiryTimeValue =
                        document
                            .getElementById(
                                "expiryTime"
                            )
                            .value;

                    const allergyInfoValue =
                        document
                            .getElementById(
                                "allergyInfo"
                            )
                            .value
                            .trim();

                    const storageValue =
                        document
                            .getElementById(
                                "storageInstructions"
                            )
                            .value
                            .trim();

                    if (!foodNameValue) {
                        throw new Error(
                            "Please enter the food name."
                        );
                    }

                    if (!descriptionValue) {
                        throw new Error(
                            "Please enter a description."
                        );
                    }

                    if (!quantityValue) {
                        throw new Error(
                            "Please enter the quantity."
                        );
                    }

                    if (!collectionAreaValue) {
                        throw new Error(
                            "Please enter the collection area."
                        );
                    }

                    if (!expiryTimeValue) {
                        throw new Error(
                            "Please select a collection deadline."
                        );
                    }

                    const listingData = {
                        foodName:
                            foodNameValue,

                        category:
                            categoryValue,

                        description:
                            descriptionValue,

                        quantity:
                            quantityValue,

                        location:
                            collectionAreaValue,

                        expiryTime:
                            expiryTimeValue,

                        allergyInfo:
                            allergyInfoValue,

                        storageInstructions:
                            storageValue,

                        donorName:
                            userClaims.name ||
                            userClaims.email ||
                            "ShareBite user",

                        ownerUserId:
                            userClaims.sub,

                        status:
                            "Available"
                    };

                    const response =
                        await apiRequest({
                            method: "POST",
                            body: JSON.stringify(
                                listingData
                            )
                        });

                    showMessage(
                        listingMessage,
                        response.message ||
                            "Food listing published successfully.",
                        "success"
                    );

                    listingForm.reset();

                    previewImage.removeAttribute(
                        "src"
                    );

                    previewContainer.classList
                        .remove("show");

                } catch (error) {
                    console.error(
                        "Food listing failed:",
                        error
                    );

                    showMessage(
                        listingMessage,
                        error.message ||
                            "The food listing could not be published.",
                        "error"
                    );
                } finally {
                    publishButton.disabled = false;
                    publishButton.textContent =
                        "Publish listing";
                }
            }
        );

        document.addEventListener(
            "DOMContentLoaded",
            initialisePage
        );
    </script>
</body>
</html>
