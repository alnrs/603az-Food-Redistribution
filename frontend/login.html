<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | ShareBite</title><link rel="stylesheet" href="css/style.css"></head><body><div class="auth"><section class="auth-art"><a class="brand" style="color:white" href="index.html">🌿 ShareBite</a><div><h1>Welcome back</h1><p>Sign in securely to use ShareBite.</p></div><small>Passwords are processed by Amazon Cognito.</small></section><main class="auth-panel"><section class="auth-card"><h1>Sign in</h1><div id="msg" class="message"></div><form id="f"><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><button id="b" class="btn primary" style="width:100%">Sign in</button></form><p><a href="register.html">Create account</a></p></section></main></div><script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script><script src="js/config.js"></script><script src="js/common.js"></script><script src="js/auth.js"></script><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b'),m=document.getElementById('msg');b.disabled=true;try{await signIn(email.value.trim(),password.value);location.replace(new URLSearchParams(location.search).get('next')||'dashboard.html')}catch(x){showMessage(m,x.message,'error')}finally{b.disabled=false}}</script></body></html>
