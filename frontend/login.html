<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Sign in | ShareBite</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth">

        <section class="auth-art">
            <a
                class="brand"
                style="color: white;"
                href="index.html"
            >
                🌿 ShareBite
            </a>

            <div>
                <h1>Welcome back</h1>

                <p>
                    Sign in securely to use ShareBite.
                </p>
            </div>

            <small>
                Passwords are processed securely by Amazon Cognito.
            </small>
        </section>

        <main class="auth-panel">

            <section class="auth-card">

                <h1>Sign in</h1>

                <div
                    id="authMessage"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        id="loginButton"
                        class="btn primary"
                        type="submit"
                        style="width: 100%;"
                    >
                        Sign in
                    </button>

                </form>

                <p style="margin-top: 16px; text-align: center;">
                    <a href="forgot-password.html">
                        Forgot password?
                    </a>
                </p>

                <p style="margin-top: 12px; text-align: center;">
                    Do not have an account?
                    <a href="register.html">
                        Create account
                    </a>
                </p>

            </section>

        </main>

    </div>

    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
