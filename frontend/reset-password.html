<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Choose New Password | ShareBite</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth">

        <section class="auth-art">
            <a
                class="brand"
                style="color: white;"
                href="index.html"
            >
                🌿 ShareBite
            </a>

            <div>
                <h1>Create a new password</h1>

                <p>
                    Enter the code sent to your email and choose a new
                    password.
                </p>
            </div>

            <small>
                Your password must satisfy the ShareBite password policy.
            </small>
        </section>

        <main class="auth-panel">

            <section class="auth-card">

                <h1>Choose new password</h1>

                <div
                    id="authMessage"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></div>

                <form id="resetPasswordForm">

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="resetCode">
                            Reset code
                        </label>

                        <input
                            id="resetCode"
                            name="resetCode"
                            type="text"
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            maxlength="6"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="newPassword">
                            New password
                        </label>

                        <input
                            id="newPassword"
                            name="newPassword"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">
                            Confirm new password
                        </label>

                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button
                        id="resetPasswordButton"
                        class="btn primary"
                        type="submit"
                        style="width: 100%;"
                    >
                        Update password
                    </button>

                </form>

                <p style="margin-top: 20px; text-align: center;">
                    Need another code?
                    <a href="forgot-password.html">
                        Send a new code
                    </a>
                </p>

            </section>

        </main>

    </div>

    <script src="https://unpkg.com/amazon-cognito-identity-js@6.3.15/dist/amazon-cognito-identity.min.js"></script>
    <script src="js/config.js"></script>

    <script>
        "use strict";

        const messageBox = document.getElementById("authMessage");
        const form = document.getElementById("resetPasswordForm");
        const button = document.getElementById("resetPasswordButton");
        const emailInput = document.getElementById("email");

        function showMessage(message, type = "error") {
            messageBox.textContent = message;
            messageBox.style.display = "block";

            messageBox.classList.remove(
                "error",
                "success",
                "alert-error",
                "alert-success"
            );

            if (type === "success") {
                messageBox.classList.add("success", "alert-success");
            } else {
                messageBox.classList.add("error", "alert-error");
            }
        }

        function setLoading(loading) {
            button.disabled = loading;
            button.textContent = loading
                ? "Updating password..."
                : "Update password";
        }

        const queryParameters =
            new URLSearchParams(window.location.search);

        const emailFromUrl = queryParameters.get("email");

        const savedEmail =
            sessionStorage.getItem("sharebiteResetEmail");

        if (emailFromUrl) {
            emailInput.value = emailFromUrl;
        } else if (savedEmail) {
            emailInput.value = savedEmail;
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();

            const code = document
                .getElementById("resetCode")
                .value
                .trim();

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (!email) {
                showMessage("Please enter your registered email address.");
                return;
            }

            if (!code) {
                showMessage("Please enter the six-digit reset code.");
                return;
            }

            if (newPassword.length < 8) {
                showMessage(
                    "Your new password must contain at least 8 characters."
                );
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage("The two passwords do not match.");
                return;
            }

            if (!window.SHAREBITE_CONFIG) {
                showMessage("ShareBite configuration could not be loaded.");
                return;
            }

            const userPool =
                new AmazonCognitoIdentity.CognitoUserPool({
                    UserPoolId: window.SHAREBITE_CONFIG.userPoolId,
                    ClientId: window.SHAREBITE_CONFIG.userPoolClientId
                });

            const cognitoUser =
                new AmazonCognitoIdentity.CognitoUser({
                    Username: email,
                    Pool: userPool
                });

            setLoading(true);

            cognitoUser.confirmPassword(
                code,
                newPassword,
                {
                    onSuccess: function () {
                        setLoading(false);

                        sessionStorage.removeItem(
                            "sharebiteResetEmail"
                        );

                        showMessage(
                            "Your password has been changed successfully.",
                            "success"
                        );

                        window.setTimeout(function () {
                            window.location.href = "login.html";
                        }, 1200);
                    },

                    onFailure: function (error) {
                        setLoading(false);

                        showMessage(
                            error.message ||
                            "The password could not be changed."
                        );
                    }
                }
            );
        });
    </script>
</body>
</html>
